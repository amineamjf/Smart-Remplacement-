async function camOpen(cb){saveUInow();const done=f=>{if(!f)return say('⚠️ Aucune photo reçue');try{const r=cb({files:[f]});if(r&&r.catch)r.catch(e=>say('⚠️ Photo non enregistrée : '+e.message))}catch(e){say('⚠️ Photo non enregistrée : '+e.message)}};
const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;z-index:99999;background:#000;display:flex;flex-direction:column';o.innerHTML='<video playsinline muted autoplay style="flex:1;min-height:0;width:100%;object-fit:cover"></video><div id="cm" style="color:#fff;text-align:center;padding:8px;font:14px system-ui"></div><div style="display:flex;gap:10px;padding:12px;background:#000"><button id="cx" style="flex:1;background:#444;color:#fff;border-radius:14px;height:56px;width:auto">Annuler</button><button id="cs" style="flex:2;background:#fff;color:#000;border-radius:14px;height:56px;width:auto;font-weight:700">📸 Prendre</button></div>';document.body.appendChild(o);const v=o.querySelector('video');let st;const end=()=>{st&&st.getTracks().forEach(t=>t.stop());o.remove()};o.addEventListener('click',e=>e.stopPropagation());o.querySelectorAll('button').forEach(b=>b.type='button');o.querySelector('#cx').onclick=end;
const fallback=msg=>{o.querySelector('#cm').innerHTML=msg+'<br>Utilisez l\'appareil photo du téléphone :';const l=document.createElement('label');l.style.cssText='display:block;margin:8px auto;padding:14px;background:#1257d6;color:#fff;border-radius:14px;width:80%';l.innerHTML='📷 Appareil photo<input type="file" accept="image/*" capture="environment" hidden>';l.querySelector('input').onchange=function(){const f=this.files[0];end();done(f)};o.querySelector('#cm').appendChild(l);o.querySelector('#cs').style.display='none'};
{const cm=o.querySelector('#cm');cm.innerHTML='<a id="nat" style="text-decoration:underline">📱 Utiliser l\'appareil photo du téléphone</a><br><small style="opacity:.7">Sinon : Annuler, puis « Continuer sans photo »</small>';cm.querySelector('#nat').onclick=()=>fallback('')}
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){fallback('Caméra intégrée indisponible sur ce navigateur.');return}
try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});v.srcObject=st;await v.play().catch(()=>{});const rdy=()=>new Promise(r=>{if(v.videoWidth)return r(1);const t=setTimeout(()=>r(0),3000);v.addEventListener('loadedmetadata',()=>{clearTimeout(t);r(1)},{once:true})});setTimeout(()=>{if(document.body.contains(o)&&!v.videoWidth)o.querySelector('#cm').insertAdjacentHTML('afterbegin','La caméra démarre lentement…<br>')},5000);o.querySelector('#cs').onclick=async()=>{if(!await rdy())return say('Caméra pas encore prête, patientez un instant…');const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.toBlob(b=>{if(!b)return say('⚠️ Capture impossible, réessayez');end();done(new File([b],'photo_'+Date.now()+'.jpg',{type:'image/jpeg'}))},'image/jpeg',.8)}}catch(e){fallback('Caméra intégrée indisponible ('+(e.name||'erreur')+').')}}
const PHL={pb1:'Problème',pb2:'Problème 2',avant:'Avant',ancienP:'Avant — ancien compteur',nouvP:'Après — nouveau compteur + plomb'};
const shrink=(f,k)=>new Promise((r,j)=>{if(!f)return j(new Error('aucune image'));const i=new Image(),u=URL.createObjectURL(f);i.onerror=()=>{URL.revokeObjectURL(u);j(new Error('image illisible'))};i.onload=()=>{URL.revokeObjectURL(u);const s=Math.min(1,1024/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;const x=c.getContext('2d'),m=M.find(m=>m.id==cur)||{},num=k=='nouvP'?(D.nn||''):(m.num||''),l1=[m.contrat?'Contrat '+m.contrat:'',num?'Compteur '+num:'',PHL[k]||k||''].filter(Boolean).join(' | '),l2=new Date().toLocaleString()+(D.lat?`  GPS ${D.lat.toFixed(5)}, ${D.lon.toFixed(5)}`:'');x.drawImage(i,0,0,c.width,c.height);x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,c.height-40,c.width,40);x.fillStyle='#fff';x.font='bold 15px sans-serif';x.fillText(l1,6,c.height-23,c.width-12);x.font='13px sans-serif';x.fillText(l2,6,c.height-6,c.width-12);r(c.toDataURL('image/jpeg',.7))};i.src=u});
let stream,scanning;
function zx(){if(window.ZXing)return Promise.resolve(window.ZXing);return new Promise((ok,ko)=>{const t=document.createElement('script');t.src='https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js';t.onload=()=>window.ZXing?ok(window.ZXing):ko(new Error('ZXing'));t.onerror=()=>ko(new Error('Connexion requise pour charger le lecteur'));document.head.appendChild(t)})}
async function mkDec(){if('BarcodeDetector'in window){try{const f=await BarcodeDetector.getSupportedFormats();if(f.length){const bd=new BarcodeDetector({formats:f});return async src=>{const r=await bd.detect(src);return r[0]?.rawValue||''}}}catch(e){}}
const Z=await zx(),H=new Map;H.set(Z.DecodeHintType.TRY_HARDER,true);const rd=new Z.MultiFormatReader();rd.setHints(H);
return async src=>{const w=src.videoWidth||src.naturalWidth||src.width,h=src.videoHeight||src.naturalHeight||src.height;if(!w)return'';const c=document.createElement('canvas'),k=Math.min(1,1000/Math.max(w,h));c.width=w*k;c.height=h*k;c.getContext('2d').drawImage(src,0,0,c.width,c.height);try{const l=new Z.HTMLCanvasElementLuminanceSource(c),r=rd.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(l)));return r.getText()}catch(e){return''}}}
function setScan(k,val){val=String(val||'').trim();if(!val)return;D[k]=val;stopScan();const m=M.find(x=>x.id==cur);if(k=='ancien'&&m&&m.num&&String(m.num).trim()!=val)say('⚠️ Numéro lu ('+val+') différent du compteur importé ('+m.num+')');else say('✔ Numéro lu : '+val);R()}
async function decFile(k,f){if(!f)return;try{const dec=await mkDec(),i=new Image();i.src=URL.createObjectURL(f);await i.decode();const v=await dec(i);if(v)setScan(k,v);else scanFail(k,'Aucun code détecté sur la photo.')}catch(e){scanFail(k,e.message)}}
function scanFail(k,msg){stopScan();const nums=[...new Set(M.map(m=>m.num).filter(Boolean))];const o=document.createElement('div');o.id='dlg';o.innerHTML=`<div><h3>Lecture impossible</h3><p class="mut">${esc(msg||'')}</p>
<button onclick="this.closest('#dlg').remove();scan('${k}')">🔄 Réessayer le scan</button>
<label class="btn s">📷 Photo du code (lecture)<input type="file" accept="image/*" capture="environment" hidden onchange="this.closest('#dlg').remove();decFile('${k}',this.files[0])"></label>
${nums.length?`<label>Choisir dans les compteurs importés</label><input list="numl" id="numc" placeholder="Rechercher un numéro…"><datalist id="numl">${nums.map(n=>`<option value="${esc(n)}">`).join('')}</datalist><button class="ok" onclick="const v=$('#numc').value;this.closest('#dlg').remove();setScan('${k}',v)">Utiliser ce numéro</button>`:''}
<label>Saisie manuelle</label><input id="numm" inputmode="numeric"><button class="s" onclick="const v=$('#numm').value;this.closest('#dlg').remove();setScan('${k}',v)">Valider la saisie</button>
<button class="er" onclick="this.closest('#dlg').remove()">Annuler</button></div>`;document.body.appendChild(o)}
async function scan(k='nn'){saveUInow();let dec;try{dec=await mkDec()}catch(e){return scanFail(k,'Lecteur indisponible : '+e.message)}
if(!navigator.mediaDevices?.getUserMedia)return scanFail(k,'Caméra intégrée indisponible sur ce navigateur.');
try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false})}catch(e){return scanFail(k,'Caméra refusée ou indisponible ('+(e.name||'')+').')}
const v=$('#vid video');v.srcObject=stream;await v.play().catch(()=>{});$('#vid').style.display='block';scanning=true;const t0=Date.now();
(async function loop(){while(scanning){try{const r=await dec(v);if(r)return setScan(k,r)}catch(e){}if(Date.now()-t0>20000)return scanFail(k,'Aucun code détecté après 20 s. Rapprochez le code, éclairez-le, ou choisissez une option.');await new Promise(r=>setTimeout(r,200))}})()}
function stopScan(){scanning=false;stream?.getTracks().forEach(t=>t.stop());stream=null;$('#vid').style.display='none'}
init();
